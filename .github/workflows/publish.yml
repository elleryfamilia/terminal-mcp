name: Publish to npm

on:
  push:
    tags:
      - 'v*'

# Trusted publishing: npm exchanges this OIDC token for a short-lived
# credential, so no long-lived NPM_TOKEN secret is needed.
permissions:
  contents: read
  id-token: write

jobs:
  stage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          # npm docs: never cache dependencies in a release build
          package-manager-cache: false

      # Staged publishing requires npm 11.15.0 or later.
      - name: Upgrade npm
        run: npm install --global npm@^11.15.0

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Stage package for approval
        # Nothing goes live until a maintainer approves the staged version
        # with 2FA:
        #   npm stage list
        #   npm stage approve <stage-id>
        # or the Staged Packages tab on npmjs.com. Provenance is generated
        # automatically for trusted publishing.
        run: npm stage publish --access public

  release:
    needs: stage
    runs-on: ubuntu-latest

    # Creating a GitHub Release needs write access; the stage job above
    # stays read-only.
    permissions:
      contents: write

    steps:
      - name: Create draft GitHub Release
        # Draft so the release is not announced before the npm package is
        # approved. Publish the draft after approving the staged version.
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
