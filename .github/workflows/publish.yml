name: Publish to npm

on:
  push:
    tags:
      - 'v*'

# Trusted publishing: npm exchanges this OIDC token for a short-lived
# publish credential, so no long-lived NPM_TOKEN secret is needed.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          # npm docs: never cache dependencies in a release build
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        # Provenance is generated automatically for trusted publishing.
        run: npm publish --access public

  release:
    needs: publish
    runs-on: ubuntu-latest

    # Creating a GitHub Release needs write access; the publish job above
    # stays read-only.
    permissions:
      contents: write

    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
